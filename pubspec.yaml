name: notease
description: A minimal, beautiful cross-platform notes app with multi-provider sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1
  go_router: ^14.6.2
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  dio: ^5.7.0
  flutter_svg: ^2.0.12
  gap: ^3.0.1
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/
