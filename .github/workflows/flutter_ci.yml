name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests (Smart Selective Runner)
        run: |
          chmod +x tool/run_changed_tests.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./tool/run_changed_tests.sh "origin/${{ github.base_ref }}"
          else
            ./tool/run_changed_tests.sh
          fi
