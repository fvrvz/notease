name: Build & Attach Release Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      target:
        description: 'Target platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - windows
          - linux
          - web

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Android asset already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG_NAME" --json assets -q '.assets[].name' | grep -q "^NoteEase-Android.apk$"; then
            echo "ASSET_EXISTS=true" >> $GITHUB_ENV
            echo "NoteEase-Android.apk already exists on release $TAG_NAME. Skipping build."
          else
            echo "ASSET_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Set up Java
        if: env.ASSET_EXISTS != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        if: env.ASSET_EXISTS != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: env.ASSET_EXISTS != 'true'
        run: flutter pub get

      - name: Build Android APK
        if: env.ASSET_EXISTS != 'true'
        run: flutter build apk --release

      - name: Prepare APK Asset
        if: env.ASSET_EXISTS != 'true'
        run: cp build/app/outputs/flutter-apk/app-release.apk NoteEase-Android.apk

      - name: Upload to Release
        if: env.ASSET_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "Uploading NoteEase-Android.apk to release $TAG_NAME..."
          gh release upload "$TAG_NAME" NoteEase-Android.apk --clobber

  build-macos:
    name: Build macOS App
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if macOS asset already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG_NAME" --json assets -q '.assets[].name' | grep -q "^NoteEase-macOS.zip$"; then
            echo "ASSET_EXISTS=true" >> $GITHUB_ENV
            echo "NoteEase-macOS.zip already exists on release $TAG_NAME. Skipping build."
          else
            echo "ASSET_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Set up Flutter
        if: env.ASSET_EXISTS != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: env.ASSET_EXISTS != 'true'
        run: flutter pub get

      - name: Build macOS Application
        if: env.ASSET_EXISTS != 'true'
        run: flutter build macos --release

      - name: Package macOS App into Zip
        if: env.ASSET_EXISTS != 'true'
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent notease.app NoteEase-macOS.zip
          mv NoteEase-macOS.zip ${{ github.workspace }}/NoteEase-macOS.zip

      - name: Upload to Release
        if: env.ASSET_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "Uploading NoteEase-macOS.zip to release $TAG_NAME..."
          gh release upload "$TAG_NAME" NoteEase-macOS.zip --clobber

  build-windows:
    name: Build Windows App
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Windows asset already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG_NAME" --json assets -q '.assets[].name' | grep -q "^NoteEase-Windows-x64.zip$"; then
            echo "ASSET_EXISTS=true" >> $GITHUB_ENV
            echo "NoteEase-Windows-x64.zip already exists on release $TAG_NAME. Skipping build."
          else
            echo "ASSET_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Set up Flutter
        if: env.ASSET_EXISTS != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: env.ASSET_EXISTS != 'true'
        run: flutter pub get

      - name: Build Windows Application
        if: env.ASSET_EXISTS != 'true'
        run: flutter build windows --release

      - name: Package Windows Bundle into Zip
        if: env.ASSET_EXISTS != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath NoteEase-Windows-x64.zip

      - name: Upload to Release
        if: env.ASSET_EXISTS != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "Uploading NoteEase-Windows-x64.zip to release $TAG_NAME..."
          gh release upload "$TAG_NAME" NoteEase-Windows-x64.zip --clobber

  build-linux:
    name: Build Linux App
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Linux asset already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG_NAME" --json assets -q '.assets[].name' | grep -q "^NoteEase-Linux-x64.tar.gz$"; then
            echo "ASSET_EXISTS=true" >> $GITHUB_ENV
            echo "NoteEase-Linux-x64.tar.gz already exists on release $TAG_NAME. Skipping build."
          else
            echo "ASSET_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Install Linux Build Dependencies
        if: env.ASSET_EXISTS != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        if: env.ASSET_EXISTS != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        if: env.ASSET_EXISTS != 'true'
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        if: env.ASSET_EXISTS != 'true'
        run: flutter pub get

      - name: Build Linux Application
        if: env.ASSET_EXISTS != 'true'
        run: flutter build linux --release

      - name: Package Linux Bundle into Tarball
        if: env.ASSET_EXISTS != 'true'
        run: |
          tar -czf NoteEase-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload to Release
        if: env.ASSET_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "Uploading NoteEase-Linux-x64.tar.gz to release $TAG_NAME..."
          gh release upload "$TAG_NAME" NoteEase-Linux-x64.tar.gz --clobber

  build-and-deploy-web:
    name: Build & Deploy Web App
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release --base-href "/notease/"

      - name: Package Web Bundle into Zip
        run: |
          cd build/web && zip -r ../../NoteEase-Web.zip .

      - name: Upload Web Asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "Uploading NoteEase-Web.zip to release $TAG_NAME..."
          gh release upload "$TAG_NAME" NoteEase-Web.zip --clobber

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: ${{ inputs.target == null || inputs.target == 'all' || inputs.target == 'web' }}
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
